version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: ola_dashboard_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web:
    build: .
    container_name: ola_dashboard_web
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://db:27017/ola_dashboard
      - NODE_ENV=production
    depends_on:
      - db

volumes:
  mongo_data:
